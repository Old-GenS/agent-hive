name: CI

# Pull requests only. A merge commit re-ran every check on the identical tree a few seconds later,
# which is the same work twice: `test` did, and `vm` did after it. `main` is covered instead by
# `test.yml`, which builds a whole release from the merge and boots it in a real VM.
#
# `workflow_dispatch` stays so the suite can be run by hand against `main` when that is what you
# want to check.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # `changes` reads the pull request's file list to decide what has to run.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The `main` ruleset requires `test`, `vm` and `windows-installer`. GitHub counts a *skipped*
# required check as satisfied, so a documentation pull request can skip those jobs outright and
# merge in seconds instead of waiting for a VM boot.
#
# The one way that goes wrong is a filter that cannot decide and says "skipped" for a change that
# really needed testing. So `changes` defaults to "run everything" and only narrows it down from a
# file list it actually read; if the API call fails, everything runs.
jobs:
  # Decides whether the slow jobs have anything to check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No `set -e`: a failed `gh api` or a non-matching `grep` must not fail this job, because
          # a failed filter would skip the very checks it is supposed to select.
          set -uo pipefail
          code=true
          installer=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=""
            # gh api has timed out on these runners; retry, then fall back to running everything.
            for attempt in 1 2 3; do
              if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate --jq '.[].filename' 2>/dev/null) && [ -n "$files" ]; then
                break
              fi
              files=""
              sleep $((attempt * 5))
            done
            if [ -n "$files" ]; then
              printf '%s\n' "$files"
              if ! printf '%s\n' "$files" | grep -qE '^(src|scripts|image|vm|test|ui)/|^(package\.json|package-lock\.json|versions\.json|tsconfig\.json|install\.sh|install\.ps1)($|/)|^\.github/'; then
                code=false
              fi
              if printf '%s\n' "$files" | grep -qE '^install\.ps1$'; then
                installer=true
              else
                installer=false
              fi
            else
              echo "could not read this pull request's file list; running every check"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Configure the git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build:vm
      - run: npm test
      - run: npm run build:ui
      - name: Syntax-check every shell script
        run: |
          for f in scripts/*.sh vm/*.sh; do
            bash -n "$f" || exit 1
          done

  # There is no macOS job. GitHub's macOS runners have no usable Hypervisor.framework, so all it
  # could do was re-run `npm test` on a platform nobody can install yet — while queuing for a
  # quarter of an hour. The real macOS path is built and checked by macos-release.yml and
  # scripts/macos-smoke.mjs on a Mac (docs/MACOS.md); put a job back here when there is a macOS
  # release to install.

  windows-installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse install.ps1 in PowerShell 7 and Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors; exit 1 }
          powershell.exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count) { $e; exit 1 }'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Analyse install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning
          $bad = @($findings | Where-Object { $_.RuleName -ne 'PSAvoidUsingWriteHost' })
          if ($bad.Count) {
            $bad | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

  vm:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - name: Enable KVM and install pasta
        run: bash scripts/ci-enable-kvm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native
          key: native-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'scripts/build-native.sh', 'scripts/native-in-container.sh') }}
      - name: Create a throwaway signing key
        run: node scripts/keygen.mjs "$RUNNER_TEMP/release-signing-key.pem" > /dev/null
      - name: Build the release
        env:
          HIVE_SIGNING_KEY: ${{ runner.temp }}/release-signing-key.pem
          HIVE_RELEASE_SKIP_SOURCES: "1"
        run: npm run release
      - name: Extract the app bundle and its rootfs
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "release/$version/hive-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bundle"
          rootfs_archive=$(ls "release/$version"/hive-rootfs-*-linux-x86_64.tar.gz)
          rver=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          dest="$RUNNER_TEMP/rootfs/$rver"  # fresh: the build exported its own copy under ~/.local/share
          mkdir -p "$dest"
          tar -xzf "$rootfs_archive" -C "$dest" --no-same-owner
          touch "$dest/.complete"
          echo "HIVE_BUNDLE_ROOT=$RUNNER_TEMP/bundle/hive-$version" >> "$GITHUB_ENV"
          echo "HIVE_ROOTFS=$dest" >> "$GITHUB_ENV"
      - name: Real VM smoke test
        run: node scripts/vm-smoke.mjs
