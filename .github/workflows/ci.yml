name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Configure the git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build:vm
      - run: npm test
      - run: npm run build:ui
      - name: Syntax-check every shell script
        run: |
          for f in scripts/*.sh vm/*.sh; do
            bash -n "$f" || exit 1
          done

  # The macOS path (Hypervisor.framework, the vsock bridge, launchd, the launchd/systemd split)
  # cannot be exercised on Linux, and a red suite on a Mac hides every regression. GitHub's macOS
  # runners are VMs without a usable HVF, so this builds the launcher and runs the unit tests; the
  # real VM is checked by hand (scripts/macos-spike and docs/MACOS.md).
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Configure the git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build:vm
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse install.ps1 in PowerShell 7 and Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors; exit 1 }
          powershell.exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count) { $e; exit 1 }'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Analyse install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning
          $bad = @($findings | Where-Object { $_.RuleName -ne 'PSAvoidUsingWriteHost' })
          if ($bad.Count) {
            $bad | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

  vm:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - name: Enable KVM and install pasta
        run: bash scripts/ci-enable-kvm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native
          key: native-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'scripts/build-native.sh', 'scripts/native-in-container.sh') }}
      - name: Create a throwaway signing key
        run: node scripts/keygen.mjs "$RUNNER_TEMP/release-signing-key.pem" > /dev/null
      - name: Build the release
        env:
          HIVE_SIGNING_KEY: ${{ runner.temp }}/release-signing-key.pem
          HIVE_RELEASE_SKIP_SOURCES: "1"
        run: npm run release
      - name: Extract the app bundle and its rootfs
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "release/$version/hive-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bundle"
          rootfs_archive=$(ls "release/$version"/hive-rootfs-*-linux-x86_64.tar.gz)
          rver=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          dest="$RUNNER_TEMP/rootfs/$rver"  # fresh: the build exported its own copy under ~/.local/share
          mkdir -p "$dest"
          tar -xzf "$rootfs_archive" -C "$dest" --no-same-owner
          touch "$dest/.complete"
          echo "HIVE_BUNDLE_ROOT=$RUNNER_TEMP/bundle/hive-$version" >> "$GITHUB_ENV"
          echo "HIVE_ROOTFS=$dest" >> "$GITHUB_ENV"
      - name: Real VM smoke test
        run: node scripts/vm-smoke.mjs
