name: Stable release

# Builds, boots, signs and publishes the next stable release of main. Press Run and approve: the
# form has no fields because nothing on it needs a human. The version is the patch after the newest
# release (0.5.8 -> 0.5.9), the VM rootfs is built fresh, and the bundle the smoke test boots is the
# one that gets signed and published.
#
# Signing is keyless: the signature is made with this run's GitHub OIDC token, so there is no key
# to hold or leak. Clients accept it only when the certificate names
# `release.yml@refs/heads/main` (src/release-key.ts, RELEASE_SIGNING_IDENTITY).
#
# The `stable-release` environment must require a reviewer: that click is what makes a release a
# deliberate act, and it needs a browser session, not a token on the build box.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: stable-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - name: Enable KVM and install pasta
        run: bash scripts/ci-enable-kvm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native
          key: native-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'scripts/build-native.sh', 'scripts/native-in-container.sh') }}

      # Fails closed: if `stable-release` has no required reviewer (GitHub creates environments
      # unprotected when a workflow first references one), refuse to build or sign anything.
      - name: Refuse to sign without a reviewer on the environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${{ github.repository }}/environments/stable-release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$rules" -lt 1 ]; then
            echo "stable-release has no required reviewer; refusing to sign" >&2
            exit 1
          fi

      # Everything the form used to ask for is worked out here: the version is the next patch, so
      # there is nothing to type, bump, or copy from the releases page.
      - id: release
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags.txt"
          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { nextStableVersion } from "./scripts/release-rootfs.mjs";
            const tags = readFileSync(process.env.RUNNER_TEMP + "/tags.txt", "utf8").split("\n").filter(Boolean);
            const fallback = JSON.parse(readFileSync("./package.json", "utf8")).version;
            console.log(nextStableVersion(tags, fallback));
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # --skip-sign: signing happens below, with the OIDC token. Nothing on this runner holds a key.
      - name: Build ${{ steps.release.outputs.version }}
        env:
          HIVE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run release -- --skip-sign

      # The artifact booted here is the one that gets signed and published below, so a release
      # cannot ship something that was never started in a VM.
      - name: Boot the release in a real VM
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "release/$VERSION/hive-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bundle"
          rootfs_archive=$(ls "release/$VERSION"/hive-rootfs-*-linux-x86_64.tar.gz)
          rver=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          dest="$RUNNER_TEMP/rootfs/$rver"
          mkdir -p "$dest"
          tar -xzf "$rootfs_archive" -C "$dest" --no-same-owner
          touch "$dest/.complete"
          HIVE_BUNDLE_ROOT="$RUNNER_TEMP/bundle/hive-$VERSION" HIVE_ROOTFS="$dest" node scripts/vm-smoke.mjs

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS with the workflow's identity
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "release/$VERSION/SHA256SUMS.sigstore.json" \
            "release/$VERSION/SHA256SUMS"

      - name: Check the bundle names this workflow
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "release/$VERSION/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "release/$VERSION/SHA256SUMS"

      # The shipped verifier is what users actually run: if it rejects this bundle, the release
      # would be unusable, so fail here instead of after publishing.
      - name: Check the client accepts it
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifySigstoreBundle } from "./dist/verify-sigstore.js";
            import { RELEASE_IDENTITY } from "./dist/release-key.js";
            const dir = "release/" + process.env.VERSION;
            const ok = await verifySigstoreBundle(
              readFileSync(dir + "/SHA256SUMS"),
              readFileSync(dir + "/SHA256SUMS.sigstore.json", "utf8"),
              RELEASE_IDENTITY,
            );
            if (!ok) {
              console.error("the client rejects the bundle this workflow produced");
              process.exit(1);
            }
            console.log("client accepts the bundle");
          '

      - name: Publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.release.outputs.sha }}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Stable release v$VERSION.

          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Signed keyless by the release workflow; installs verify that identity, not a key.
          EOF
          gh release create "v$VERSION" \
            --target "$sha" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/"$VERSION"/*
