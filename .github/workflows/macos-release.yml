name: macOS release bundle (arm64)

# Builds the macOS app bundle and its arm64 VM image on GitHub's runners, then uploads both as a
# workflow artifact. This is a build check and a testing bundle, not a distributable release: the
# runner signs with a throwaway key and cannot boot Hypervisor.framework. A stable release is built
# on a Mac with the release key (scripts/build-release-macos.sh), then attached to the GitHub
# release. See docs/RELEASING.md and docs/MACOS.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to package.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One image builder for both workflows: the arm64 Fedora image needs an arm64 Linux runner, and
  # macOS cannot make ext4.
  image:
    uses: ./.github/workflows/macos-image.yml

  bundle:
    needs: image
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hive-rootfs-image-${{ github.sha }}
          path: build/rootfs-image
      - name: Create a throwaway signing key
        run: node scripts/keygen.mjs "$RUNNER_TEMP/release-signing-key.pem" > /dev/null
      - name: Build the macOS release
        env:
          HIVE_SIGNING_KEY: ${{ runner.temp }}/release-signing-key.pem
          HIVE_RELEASE_SKIP_SOURCES: "1"
          HIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image=$(ls build/rootfs-image/*.img.gz)
          bash scripts/build-release-macos.sh --rootfs-image "$image"
      - name: Check the bundle
        run: |
          set -euo pipefail
          version=$(basename "$(ls -d release/*/ | head -n 1)")
          dir="release/$version"
          ( cd "$dir" && shasum -a 256 -c SHA256SUMS )
          app="$dir/hive-$version-darwin-arm64.tar.gz"
          tar -tzf "$app" | grep -qx "hive-$version/bin/hive"
          tar -xzf "$app" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/hive-$version/bin/hive" --version
          codesign --verify --strict "$RUNNER_TEMP/hive-$version/libexec/hive-vm"
          codesign --verify --strict "$RUNNER_TEMP/hive-$version/lib/libkrun.1.dylib"
      - name: Upload the macOS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-macos-arm64-${{ github.sha }}
          path: |
            release/*/hive-*-darwin-arm64.tar.gz
            release/*/hive-rootfs-*-linux-arm64.img.gz
            release/*/SHA256SUMS
            release/*/SHA256SUMS.sig
          retention-days: 14
