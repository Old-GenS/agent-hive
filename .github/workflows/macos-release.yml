name: macOS release bundle (arm64)

# Builds the macOS app bundle and its arm64 VM image on GitHub's runners, then uploads both as a
# workflow artifact. This is a build check and a testing bundle, not a distributable release: the
# runner cannot boot Hypervisor.framework, and it writes an unsigned SHA256SUMS. A stable release is
# signed keyless by promote.yml, built on a Mac (scripts/build-release-macos.sh), then attached to
# the GitHub release. See docs/RELEASING.md and docs/MACOS.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to package.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One image builder for both workflows: the arm64 Fedora image needs an arm64 Linux runner, and
  # macOS cannot make ext4.
  image:
    uses: ./.github/workflows/macos-image.yml

  bundle:
    needs: image
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hive-rootfs-image-${{ github.sha }}
          path: build/rootfs-image
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-macos
          key: native-macos-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'vm/build.sh', 'scripts/build-native-macos.sh') }}
      - name: Build the macOS release
        env:
          HIVE_RELEASE_SKIP_SOURCES: "1"
          HIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(build/rootfs-image/*.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "expected one .img.gz from the image job, found ${#images[@]}" >&2
            exit 1
          fi
          bash scripts/build-release-macos.sh --rootfs-image "${images[0]}"
      - name: Check the bundle
        run: |
          set -euo pipefail
          version=$(basename "$(ls -d release/*/ | head -n 1)")
          dir="release/$version"
          ( cd "$dir" && shasum -a 256 -c SHA256SUMS )
          app="$dir/hive-$version-darwin-arm64.tar.gz"
          tar -tzf "$app" | grep -qx "hive-$version/bin/hive"
          tar -xzf "$app" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/hive-$version/bin/hive" --version
          codesign --verify --strict "$RUNNER_TEMP/hive-$version/libexec/hive-vm"
          codesign --verify --strict "$RUNNER_TEMP/hive-$version/lib/libkrun.1.dylib"
      - name: Upload the macOS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-macos-arm64-${{ github.sha }}
          path: |
            release/*/hive-*-darwin-arm64.tar.gz
            release/*/hive-rootfs-*-linux-arm64.img.gz
            release/*/SHA256SUMS
          retention-days: 14
