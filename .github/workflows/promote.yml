name: Promote to stable

# Takes a test build and publishes it as the stable release. Nothing is built here: the
# files are downloaded from the `test` prerelease, checked against its own SHA256SUMS, signed, and
# published under the version the test build was made for. So what users get is byte-for-byte what
# the test run booted in a VM — the microVM filesystem included.
#
# Saying no to a build: don't run this. The test release is simply replaced by the next build.
#
# The `stable-release` environment must require a reviewer: that click is the only thing between a
# test build and the users, so it has to need a browser session, not a token on a box.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Test build tag to promote (empty: the newest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stable-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci && npm run build

      # Fails closed: GitHub creates environments unprotected when a workflow first references one,
      # so a missing reviewer would make this step a no-op gate rather than a gate.
      - name: Refuse to promote without a reviewer on the environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${{ github.repository }}/environments/stable-release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$rules" -lt 1 ]; then
            echo "stable-release has no required reviewer; refusing to promote" >&2
            exit 1
          fi

      # The version comes from the build, not from this run: a promoted build must keep the number
      # it was made with, or the bundle inside the tarball would disagree with its release tag.
      - id: build
        name: Fetch the test build
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.build }}
        run: |
          set -euo pipefail
          # Default to the newest test build; anything older can still be named explicitly, which
          # is the point of keeping five around.
          if [ -n "$WANTED" ]; then
            tag="$WANTED"
          else
            tag=$(gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("test-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "no test build to promote" >&2
            exit 1
          fi

          dir="$RUNNER_TEMP/test"
          mkdir -p "$dir"
          gh release download "$tag" --repo "${{ github.repository }}" --dir "$dir"
          # `hive-*` would also match hive-rootfs-<id>-linux-x86_64.tar.gz, and the version came out
          # as "rootfs-<id>" once because of it. Only the app bundle starts with hive-<digit>.
          app=$(ls "$dir"/hive-[0-9]*-linux-x86_64.tar.gz)
          version=$(basename "$app" | sed -E 's/-linux-x86_64\.tar\.gz$//; s/^hive-//')
          if [ -z "$version" ]; then
            echo "the test build has no linux-x86_64 bundle" >&2
            exit 1
          fi
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$version is already released; pick a test build made after that release" >&2
            exit 1
          fi
          sha=$(gh release view "$tag" --repo "${{ github.repository }}" --json targetCommitish --jq .targetCommitish)
          created=$(gh release view "$tag" --repo "${{ github.repository }}" --json createdAt --jq .createdAt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Promoting v$version from $tag ($created, commit $sha)" >> "$GITHUB_STEP_SUMMARY"

      # Same bytes in, same bytes out: if an asset does not match the tested SHA256SUMS, stop.
      - name: Check the files against the tested SHA256SUMS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/test"
          sha256sum -c SHA256SUMS

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the tested SHA256SUMS with this workflow's identity
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/test/SHA256SUMS.sigstore.json" \
            "$RUNNER_TEMP/test/SHA256SUMS"

      - name: Check the signature names this workflow
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/test/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/promote.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/test/SHA256SUMS"

      # The shipped verifier is what users run: if it rejects this bundle, the release would be
      # unusable, so fail before publishing rather than after.
      - name: Check the client accepts it
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifySigstoreBundle } from "./dist/verify-sigstore.js";
            import { RELEASE_IDENTITY } from "./dist/release-key.js";
            const dir = process.env.RUNNER_TEMP + "/test";
            const ok = await verifySigstoreBundle(
              readFileSync(dir + "/SHA256SUMS"),
              readFileSync(dir + "/SHA256SUMS.sigstore.json", "utf8"),
              RELEASE_IDENTITY,
            );
            if (!ok) {
              console.error("the client rejects the bundle this workflow produced");
              process.exit(1);
            }
            console.log("client accepts the bundle");
          '

      - name: Publish
        env:
          VERSION: ${{ steps.build.outputs.version }}
          SHA: ${{ steps.build.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/test"
          fs_id=$(ls "$dir" | sed -n 's/^hive-rootfs-\([0-9a-f]\{12\}\)-linux-x86_64\.tar\.gz$/\1/p' | head -1)
          app_mb=$(du -m "$dir"/hive-[0-9]*-linux-x86_64.tar.gz | cut -f1)
          fs_mb=$(du -m "$dir"/hive-rootfs-*-linux-x86_64.tar.gz | cut -f1)

          # What changed since the last stable release: the useful part of "what am I shipping".
          prev=$(gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            commits=$(git log --oneline "$prev..$SHA" | head -40)
            [ -n "$commits" ] || commits="(no commits)"
            changes="Changes since $prev:\n\n$commits"
          else
            changes="First stable release on this repository."
          fi

          {
            printf 'Stable release v%s.\n\n' "$VERSION"
            printf 'Promoted from the test build `%s` of commit %s, which was booted in a real VM.\n' \
              "${{ steps.build.outputs.tag }}" "$SHA"
            printf 'Nothing was rebuilt: every file here is the file that build tested.\n\n'
            printf 'VM filesystem: %s (%s MB) — unchanged when this id matches what you already have,\n' "$fs_id" "$fs_mb"
            printf 'which is when `hive update` downloads nothing.\n\n'
            printf '%b\n\n' "$changes"
            printf 'Verified: every asset matched the tested SHA256SUMS, signed keyless by\n'
            printf '.github/workflows/promote.yml@refs/heads/main.\n\n'
            printf 'Files:\n'
            for f in "$dir"/*; do printf -- '- %s (%s MB)\n' "$(basename "$f")" "$(du -m "$f" | cut -f1)"; done
            printf '\nApp bundle: %s MB, VM filesystem: %s MB.\n' "$app_mb" "$fs_mb"
            printf '\nInstall or update:\n'
            printf '  curl -fsSL https://raw.githubusercontent.com/%s/main/install-cli.sh | sh\n' "$GITHUB_REPOSITORY"
            printf '  hive update\n\n'
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          # Created through the API rather than `gh release create` so a refusal prints GitHub's
          # own message instead of a one-line summary: the create failed with 403 once and the
          # token claimed contents: write, which is not enough to act on.
          body=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$SHA" \
            -f name="v$VERSION" \
            -f body="$(cat "$RUNNER_TEMP/notes.md")" \
            -F draft=false -F prerelease=false) || {
            echo "release create refused; token scopes:" >&2
            gh api "repos/${{ github.repository }}" --jq .permissions >&2 || true
            exit 1
          }
          id=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          gh release upload "v$VERSION" --repo "${{ github.repository }}" "$RUNNER_TEMP"/test/*
