name: Bump pinned pieces

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Look for updates
        run: node scripts/check-updates.mjs --list > "$RUNNER_TEMP/updates.json"
      - name: Open a bump pull request per component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -r '.[] | [.name, .current, .latest] | @tsv' "$RUNNER_TEMP/updates.json" |
          while IFS=$'\t' read -r name current latest; do
            [ -n "$name" ] || continue
            safe=$(printf '%s' "$latest" | sed -E 's/[^A-Za-z0-9._-]/-/g')
            branch="auto/$name-$safe"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "skipping $name: $branch already exists"
              continue
            fi
            case "$name" in
              libkrun) source="https://github.com/containers/libkrun/releases" ;;
              libkrunfw) source="https://github.com/containers/libkrunfw/releases" ;;
              passt) source="https://passt.top/passt" ;;
              rust) source="https://static.rust-lang.org/dist/channel-rust-stable.toml" ;;
              buildImage) source="https://quay.io/repository/pypa/manylinux_2_28_x86_64?tab=tags" ;;
              node) source="https://nodejs.org/dist/index.json" ;;
              pi) source="https://www.npmjs.com/package/@earendil-works/pi-coding-agent" ;;
              *) source="" ;;
            esac
            git checkout -B "$branch" origin/main
            node scripts/check-updates.mjs --apply "$name"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json image/Containerfile
            git commit -m "Bump $name $current → $latest"
            git push origin "$branch"
            url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Bump $name $current → $latest" \
              --body "The daily update check found a newer \`$name\`.

          - \`$name\`: $current → $latest
          - Source: $source

          Merges automatically when CI passes, including the real VM test, and lands in the
          next release.")
            gh workflow run ci.yml --ref "$branch"
            # Native auto-merge: GitHub merges when the ruleset's required checks are green.
            gh pr merge "$url" --auto --merge
          done
