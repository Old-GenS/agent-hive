name: Beta release

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      fresh_rootfs:
        description: Rebuild the VM rootfs instead of reusing the tested one
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      rootfs: ${{ steps.plan.outputs.rootfs }}
      reason: ${{ steps.plan.outputs.reason }}
      reuse_tag: ${{ steps.plan.outputs.reuse_tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_ROOTFS: ${{ inputs.fresh_rootfs }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          prev="$RUNNER_TEMP/prev"
          mkdir -p "$prev"
          info_file="$prev/rootfs-info.json"
          : > "$info_file"

          # The newest beta prerelease tag, through the API like the rest.
          beta_tag=$(gh release list --repo "$repo" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == true)
                       | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$"))][0].tagName // ""')

          # The newest release, stable or beta, that carries a rootfs-info.json asset.
          reuse_tag=""
          for tag in $(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName'); do
            if [ "$(gh api "repos/$repo/releases/tags/$tag" --jq 'any(.assets[]; .name == "rootfs-info.json")')" = "true" ]; then
              reuse_tag=$tag
              break
            fi
          done
          if [ -n "$reuse_tag" ]; then
            gh release download "$reuse_tag" --repo "$repo" --pattern "rootfs-info.json" --dir "$prev"
          fi

          image_tree=$(git rev-parse HEAD:image)

          # Count pending updates inside the previous rootfs, but only when it came from this image
          # tree: otherwise the plan rebuilds anyway and booting it would be wasted time.
          security=0
          updates=0
          if [ -n "$reuse_tag" ]; then
            info_tree=$(node -p "require(process.argv[1]).imageTree" "$info_file")
            if [ "$info_tree" = "$image_tree" ]; then
              gh release download "$reuse_tag" --repo "$repo" \
                --pattern "hive-rootfs-*-linux-x86_64.tar.gz" --dir "$prev"
              rootfs_archive=$(ls "$prev"/hive-rootfs-*-linux-x86_64.tar.gz)
              podman import "$rootfs_archive" localhost/rootfs-check
              security=$(podman run --rm localhost/rootfs-check dnf -q updateinfo list --updates --security | grep -c . || true)
              updates=$(podman run --rm localhost/rootfs-check dnf -q check-update | grep -c . || true)
              podman rmi localhost/rootfs-check >/dev/null 2>&1 || true
            fi
          fi

          force=""
          if [ "$FRESH_ROOTFS" = "true" ]; then force="--force"; fi
          plan=$(node scripts/rootfs-plan.mjs \
            --info "$info_file" \
            --image-tree "$image_tree" \
            --security "$security" \
            --updates "$updates" \
            $force)
          action=$(printf '%s' "$plan" | jq -r .action)
          reason=$(printf '%s' "$plan" | jq -r .reason)

          # Rebuild when beta moved (new commits), when the rootfs plan says so, or on the first
          # beta release ever.
          head=$(git rev-parse HEAD)
          if [ -z "$beta_tag" ]; then
            build=true
          elif [ "$head" != "$(git rev-parse "refs/tags/$beta_tag^{commit}")" ]; then
            build=true
          elif [ "$action" = "rebuild" ]; then
            build=true
          else
            build=false
          fi

          version=$(RUN_NUMBER="${{ github.run_number }}" node -e 'const v=require("./package.json").version.split("."); console.log([v[0],v[1],Number(v[2])+1].join(".")+"-beta."+process.env.RUN_NUMBER)')

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "rootfs=$action" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reuse_tag=$reuse_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta tag: ${beta_tag:-none}; rootfs: $action ($reason); version: $version"

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: beta-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - name: Enable KVM and install pasta
        run: bash scripts/ci-enable-kvm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native
          key: native-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'scripts/build-native.sh', 'scripts/native-in-container.sh') }}
      - name: Write the beta signing key
        env:
          BETA_SIGNING_KEY: ${{ secrets.BETA_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$BETA_SIGNING_KEY" > "$RUNNER_TEMP/beta.pem"
      - name: Download the tested rootfs
        if: needs.plan.outputs.rootfs == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reuse"
          gh release download "${{ needs.plan.outputs.reuse_tag }}" \
            --pattern "hive-rootfs-*-linux-x86_64.tar.gz" \
            --pattern "rootfs-info.json" \
            --dir "$RUNNER_TEMP/reuse"
          echo "HIVE_RELEASE_REUSE_ROOTFS=$(ls "$RUNNER_TEMP/reuse"/hive-rootfs-*-linux-x86_64.tar.gz)" >> "$GITHUB_ENV"
      - name: Build the beta release
        env:
          HIVE_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          HIVE_SIGNING_KEY: ${{ runner.temp }}/beta.pem
        run: npm run release
      - name: Verify the beta signature
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { BETA_RELEASE_PUBLIC_KEY } from "./dist/release-key.js";
            import { verifySums } from "./dist/release.js";
            const dir = "release/" + process.env.VERSION;
            const sums = readFileSync(dir + "/SHA256SUMS");
            const sig = readFileSync(dir + "/SHA256SUMS.sig", "utf8");
            if (!verifySums(sums, sig, BETA_RELEASE_PUBLIC_KEY)) {
              console.error("SHA256SUMS.sig was not signed by the beta key");
              process.exit(1);
            }
            console.log("beta signature ok");
          '
      - name: Extract the app bundle and its rootfs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "release/$VERSION/hive-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bundle"
          rootfs_archive=$(ls "release/$VERSION"/hive-rootfs-*-linux-x86_64.tar.gz)
          rver=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          dest="$RUNNER_TEMP/rootfs/$rver"  # fresh: the build exported its own copy under ~/.local/share
          mkdir -p "$dest"
          tar -xzf "$rootfs_archive" -C "$dest" --no-same-owner
          touch "$dest/.complete"
          echo "HIVE_BUNDLE_ROOT=$RUNNER_TEMP/bundle/hive-$VERSION" >> "$GITHUB_ENV"
          echo "HIVE_ROOTFS=$dest" >> "$GITHUB_ENV"
      - name: Real VM smoke test
        run: node scripts/vm-smoke.mjs
      - name: Write the release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ROOTFS_ACTION: ${{ needs.plan.outputs.rootfs }}
          ROOTFS_REASON: ${{ needs.plan.outputs.reason }}
          REUSE_TAG: ${{ needs.plan.outputs.reuse_tag }}
        run: |
          set -euo pipefail
          prev_tag=$(git tag --list 'v*-beta.*' --sort=-v:refname | head -n1)
          if [ -n "$prev_tag" ]; then
            commits=$(git log --oneline "$prev_tag..HEAD")
          else
            commits=$(git log --oneline -20)
          fi
          if [ "$ROOTFS_ACTION" = "reuse" ]; then
            rootfs_line="rootfs reused from $REUSE_TAG"
          else
            rootfs_line="rootfs rebuilt: $ROOTFS_REASON"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Daily beta build of $GITHUB_SHA.

          ## Commits
          \`\`\`
          $commits
          \`\`\`

          ## VM rootfs
          $rootfs_line

          ## Try it
          \`\`\`bash
          hive update --channel beta
          \`\`\`
          EOF
      - name: Publish the prerelease
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          gh release create "v$VERSION" \
            --prerelease \
            --target "$sha" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/"$VERSION"/*
      - name: Delete the beta signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/beta.pem"
