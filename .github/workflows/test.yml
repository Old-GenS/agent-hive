name: Test build

# The test channel: what main looks like right now, with freshly pulled distro packages, built and
# booted in a real VM. Each run publishes a prerelease tagged `test-<run>-<version>`; the newest
# five are kept, so nothing accumulates but a build you tested days ago can still be promoted.
#
# Promotion is the only thing that reaches users: `.github/workflows/promote.yml` copies these exact
# files into a stable release without rebuilding anything, so what was tested here is what ships,
# the microVM included.
#
# The version is the patch this build would be released as (0.5.9 -> 0.5.10). It is worked out at
# build time and baked into the bundle, because a build that gets promoted must not be rebuilt to
# change its version.

on:
  push:
    branches: [main]
    # Only changes that can alter the artifact are worth a build. A merge that touched docs, the
    # workflows themselves or the repository plumbing used to produce a fresh ~500 MB filesystem, a
    # VM boot and a new prerelease — ten-plus minutes and gigabytes, for nothing.
    paths:
      - "image/**"
      - "src/**"
      - "scripts/**"
      - "vm/**"
      - "ui/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "versions.json"
      - "tsconfig.json"
      - "install.sh"
      - "install-cli.sh"
      - "install.ps1"
  schedule:
    # Weekly, not daily: Debian stable moves slowly (point releases every couple of months plus
    # security updates), so a daily rebuild mostly rebuilt the same thing. Chromium is the one
    # fast-moving package; run this by hand when a Chromium security fix matters.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: node
        run: echo "version=$(node -p "require('./versions.json').node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - name: Enable KVM and install pasta
        run: bash scripts/ci-enable-kvm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native
          key: native-${{ hashFiles('versions.json', 'vm/hive-vm.c', 'scripts/build-native.sh', 'scripts/native-in-container.sh') }}

      - id: release
        name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags.txt"
          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { nextStableVersion } from "./scripts/release-rootfs.mjs";
            const tags = readFileSync(process.env.RUNNER_TEMP + "/tags.txt", "utf8").split("\n").filter(Boolean);
            const fallback = JSON.parse(readFileSync("./package.json", "utf8")).version;
            console.log(nextStableVersion(tags, fallback));
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Test build of v$version from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # --skip-sign: the test channel is not signed. A promoted build is signed by promote.yml, with
      # that workflow's identity, so signing is the promotion's act, not the build's.
      - name: Build ${{ steps.release.outputs.version }}
        env:
          HIVE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run release -- --skip-sign

      - name: Read what the image contains
        run: |
          set -euo pipefail
          img=localhost/agent-hive-sandbox:latest
          base=$(podman run --rm "$img" sh -c 'grep -m1 PRETTY_NAME /etc/os-release' | cut -d= -f2 | tr -d '"')
          {
            echo "base=$base"
            echo "node=$(podman run --rm "$img" node --version)"
            echo "chromium=$(podman run --rm "$img" chromium --version)"
            echo "pi=$(podman run --rm "$img" pi --version)"
          } > "$RUNNER_TEMP/image-info.txt"
          cat "$RUNNER_TEMP/image-info.txt"

      # The artifact booted here is the one promotion hands out, so it cannot be something that was
      # never started in a VM.
      - name: Boot the build in a real VM
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "release/$VERSION/hive-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bundle"
          rootfs_archive=$(ls "release/$VERSION"/hive-rootfs-*-linux-x86_64.tar.gz)
          rver=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          dest="$RUNNER_TEMP/rootfs/$rver"
          mkdir -p "$dest"
          tar -xzf "$rootfs_archive" -C "$dest" --no-same-owner
          touch "$dest/.complete"
          HIVE_BUNDLE_ROOT="$RUNNER_TEMP/bundle/hive-$VERSION" HIVE_ROOTFS="$dest" \
            node scripts/vm-smoke.mjs | tee "$RUNNER_TEMP/smoke.txt"

      # Each build keeps its own tag, and only the newest five survive: enough to promote a build
      # you tested a few days ago, without the pile-up the old nightlies caused.
      - name: Publish the test build
        env:
          VERSION: ${{ steps.release.outputs.version }}
          # Run number first: version-first tags sort `test-0.5.10-9` under `test-0.5.9-*`,
          # which put the newest build at the bottom of the pre-release list.
          TAG: test-${{ github.run_number }}-${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.release.outputs.sha }}"
          rootfs_archive=$(ls "release/$VERSION"/hive-rootfs-*-linux-x86_64.tar.gz)
          fs_id=$(basename "$rootfs_archive" | sed -E 's/^hive-rootfs-([0-9a-f]{12})-linux-x86_64\.tar\.gz$/\1/')
          app_mb=$(du -m "release/$VERSION/hive-$VERSION-linux-x86_64.tar.gz" | cut -f1)
          fs_mb=$(du -m "$rootfs_archive" | cut -f1)

          # The previous test build, so the notes can say whether this one changed the filesystem:
          # the id is what decides whether an installed hive downloads again.
          prev_tag=$(gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("test-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          prev_id=""
          if [ -n "$prev_tag" ]; then
            prev_id=$(gh release view "$prev_tag" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' \
              | sed -n 's/^hive-rootfs-\([0-9a-f]\{12\}\)-linux-x86_64\.tar\.gz$/\1/p')
          fi
          if [ -z "$prev_id" ]; then
            fs_line="Filesystem: $fs_id (first build)"
          elif [ "$prev_id" = "$fs_id" ]; then
            fs_line="Filesystem: $fs_id, unchanged since $prev_tag — updating downloads nothing"
          else
            fs_line="Filesystem: $prev_id -> $fs_id (new) — updating downloads about ${fs_mb} MB"
          fi

          {
            printf 'Test build of v%s, from %s.\n\n' "$VERSION" "$sha"
            printf 'Not signed. Promote it to publish it as v%s; promotion copies these files and\n' "$VERSION"
            printf 'builds nothing.\n\n'
            printf '%s\n\n' "$fs_line"
            printf 'Inside the image:\n'
            while IFS= read -r line; do printf -- '- %s\n' "$line"; done < "$RUNNER_TEMP/image-info.txt"
            printf '\nBooted in a real VM: egress proxy, LAN and metadata refusal, Chromium render and the\n'
            printf 'model-key check all passed.\n\n'
            printf 'Sizes:\n- app bundle: %s MB\n- VM filesystem: %s MB\n\n' "$app_mb" "$fs_mb"
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$sha" \
            --prerelease \
            --title "Test build of v$VERSION (#${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            release/"$VERSION"/*

          # Newest first, then drop everything past the fifth: the pruning the nightly had, kept
          # here so the test channel cannot grow without bound.
          mapfile -t tags < <(gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("test-"))] | sort_by(.createdAt) | reverse | .[].tagName')
          # A build can be kept on purpose. GitHub has no 'pin this release', so the marker is the
          # pin: a title starting with KEEP (one click in the UI), or an asset named KEEP (a
          # command), or an unreleased draft.
          for old in "${tags[@]:5}"; do
            keep=$(gh release view "$old" --repo "${{ github.repository }}" \
              --json isDraft,name,assets \
              --jq '(.isDraft) or (.name | startswith("KEEP")) or ([.assets[].name] | index("KEEP") != null)')
            if [ "$keep" = "true" ]; then
              echo "keeping $old (title starts with KEEP, KEEP asset, or draft)"
              continue
            fi
            echo "pruning $old"
            gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
