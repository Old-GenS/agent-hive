name: Dependabot auto-merge

# Dependabot can't enable auto-merge on its own pull requests: a bot may not merge its own work, so
# the enable step needs the repository's token. GitHub's native auto-merge then waits for the
# required checks (the "main" ruleset) and merges. Security and major updates included, as before.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR_URL" --auto --merge
